info:
  name: execute
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/execute
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "print(\"hello world!\")",
        "language": "python"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
